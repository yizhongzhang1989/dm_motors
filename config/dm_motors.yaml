# Common configuration schema v2. Package and full launch filename select a profile.
# nodes: defaults for direct executables; launches: arguments and per-component overrides.
# Omitted CLI arguments use this config; '' disables a dashboard and {} disables a port mapping.
version: 2
packages:
  can_bus:
    nodes:
      can_bus_node:
        backend: sim
        port: ''
        can_fd: false
        can_bitrate: 1000000
        io_rate: 1000.0
        client_timeout: 0.5
      dashboard:
        bus_namespace: /can/main
        host: 0.0.0.0
        port: 8080
    launches:
      can_bus.launch.py:
        parameters:
          namespace: can/main
          dashboard_host: 0.0.0.0
          dashboard_port: 8080
      dashboard.launch.py:
        parameters:
          bus_namespace: /can/main
          dashboard_host: 0.0.0.0
          dashboard_port: 8080
  dm_motor_control:
    nodes:
      motor_node:
        motor_name: motor
        motor_id: 1
        master_id: 0
        can_bus_namespace: /can/main
        require_virtual_bus: false
        can_fd: false
        control_rate: 200.0
        state_rate: 0.0
        max_task_duration: 60.0
        mode: 1
        configure_mode_on_startup: false
        profile: j4310_v12
        legacy_control: false
        direction: 1.0
        software_offset: 0.0
        watchdog_timeout: 0.2
        command_timeout: 0.25
        feedback_timeout: 0.1
        position_limit: 0.0
        velocity_limit: 0.0
        torque_limit: 0.0
        kp_limit: 500.0
        kd_limit: 1.0
        position_min: -1.7976931348623157e308
        position_max: 1.7976931348623157e308
        host_protection_enabled: false
        measured_velocity_limit: 0.0
        measured_torque_limit: 0.0
        estimated_torque_limit: 0.0
        mos_temperature_stop: 0.0
        rotor_temperature_stop: 0.0
        protection_samples: 3
        fault_group: ''
      dashboard:
        motor_id: 1
        host: 0.0.0.0
        port: 8081
        client_timeout: 0.75
        command_timeout: 0.25
        simulation: false
        shaft_stiffness: 1.0
        shaft_damping: 0.05
      sim_motor_node:
        motor_name: motor_1
        motor_id: 1
        master_id: 0
        mode: 1
        can_bus_namespace: /can/virtual
        physics_rate: 1000.0
        state_rate: 50.0
        integration_step: 0.0005
        mapping_position: 12.5
        mapping_velocity: 50.0
        mapping_torque: 10.0
        # Illustrative output-shaft/load parameters, not factory calibration.
        inertia: 0.01
        viscous_friction: 0.02
        coulomb_friction: 0.03
        static_friction: 0.05
        friction_model: coulomb_viscous
        stribeck_velocity: 0.15
        friction_negative_scale: 1.0
        gravity_torque: 0.0
        gravity_offset: 0.0
        joint_stiffness: 0.0
        load_torque: 0.0
        max_torque: 10.0
        no_load_speed: 50.0
        torque_time_constant: 0.002
        lower_limit: -1000000.0
        upper_limit: 1000000.0
        contact_stiffness: 200.0
        contact_damping: 2.0
        ambient_temperature: 25.0
        heat_capacity: 100.0
        thermal_resistance: 1.0
        winding_resistance: 0.8
        torque_constant: 1.0
        initial_position: 0.0
        initial_velocity: 0.0
        bus_voltage: 48.0
        velocity_kp: 1.0
        velocity_ki: 0.0
        position_kp: 8.0
        position_ki: 0.0
        anchor_stiffness: 0.5
        persistence_file: ''
    launches:
      motor.launch.py:
        parameters:
          namespace: ''
          start_can_bus: true
          can_bus_namespace: ''
          backend: serial
          port: /dev/serial/by-id/usb-HDSC_CDC_Device_00000000050C-if00
          dashboard_host: 0.0.0.0
          dashboard_port: 8081
        variants:
          simulation:
            parameters:
              backend: virtual
              port: ''
            nodes:
              dm_motor_control:
                motor_node:
                  host_protection_enabled: false
                  position_limit: 0.0
                  velocity_limit: 0.0
                  torque_limit: 0.0
                  position_min: -1.7976931348623157e+308
                  position_max: 1.7976931348623157e+308
                  measured_velocity_limit: 0.0
                  measured_torque_limit: 0.0
                  estimated_torque_limit: 0.0
                  mos_temperature_stop: 0.0
                  rotor_temperature_stop: 0.0
      dashboard.launch.py:
        parameters:
          namespace: ''
          dashboard_host: 0.0.0.0
          dashboard_port: 8081
        variants:
          simulation: {}
      bus.launch.py:
        parameters:
          namespace: ''
          control_rate: ''
          dashboard_host: 0.0.0.0
          can_dashboard_ports:
            main: 8080
          motor_dashboard_ports:
            motor_1: 8081
            motor_2: 8082
        system:
          bus_names:
          - main
          motor_names:
          - motor_1
          - motor_2
          buses:
            main:
              backend: serial
              port: /dev/serial/by-id/usb-HDSC_CDC_Device_00000000050C-if00
          motors:
            motor_1:
              bus: main
              motor_id: 1
              configure_mode_on_startup: true
            motor_2:
              bus: main
              motor_id: 2
              configure_mode_on_startup: true
        variants:
          simulation:
            system:
              buses:
                main: {backend: virtual, port: '', can_fd: false}
            devices: {}
            nodes:
              dm_motor_control:
                motor_node:
                  host_protection_enabled: false
                  position_limit: 0.0
                  velocity_limit: 0.0
                  torque_limit: 0.0
                  position_min: -1.7976931348623157e+308
                  position_max: 1.7976931348623157e+308
                  measured_velocity_limit: 0.0
                  measured_torque_limit: 0.0
                  estimated_torque_limit: 0.0
                  mos_temperature_stop: 0.0
                  rotor_temperature_stop: 0.0
